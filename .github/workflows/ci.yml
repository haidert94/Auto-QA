name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Typecheck y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # prisma generate sin DATABASE_URL real: uso valor sintético para que
      # el CLI no falle al arrancar; no se ejecutan migraciones ni se
      # conecta a Neon durante el CI.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Prisma generate
        run: npx prisma generate
      - name: Typecheck apps/api
        working-directory: apps/api
        run: npx tsc --noEmit --project tsconfig.json
      - name: Typecheck apps/web
        working-directory: apps/web
        run: |
          npx next typegen
          npx tsc --noEmit --project tsconfig.json
      - name: Typecheck apps/explorer
        working-directory: apps/explorer
        run: npx tsc --noEmit --project tsconfig.json
      - name: Build apps/api
        working-directory: apps/api
        run: npm run build
      - name: Build apps/web
        working-directory: apps/web
        run: npm run build

  unit-tests:
    name: Pruebas unitarias e integración
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: typecheck-and-build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: autoqa_ci
          POSTGRES_INITDB_ARGS: --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d autoqa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/autoqa_ci?schema=public
      AUTOQA_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/autoqa_ci?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrar la base de pruebas
        run: npx prisma migrate deploy
      - name: Pruebas de API y Explorer
        # Las suites e2e de navegador se ejecutan fuera de este workflow.
        run: |
          npm run test:ai
          node --test apps/api/test/code-health.test.cjs apps/api/test/automation-validation.test.cjs
          npm run test:scenarios
          npm run test:playwright-generator
          npm run test:screenshot-storage
          npm run test:url-guard
          npm run test:icsp
          npm run test:plans
          npm run test:k6
          npm run test:request-filter
          npm run test:lighthouse
