services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autoqa
      POSTGRES_PASSWORD: autoqa_local_only
      POSTGRES_DB: autoqa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoqa -d autoqa"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_DISABLE_VERSION_CHECK: "true"
      MP_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data
volumes:
  postgres_data:
  mailpit_data:
